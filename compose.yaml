services:
  app:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:3978:3978"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - files:/srv/files
    depends_on:
      - postgres
    restart: unless-stopped
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: bebotter2
      POSTGRES_DB: bebotter2
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
volumes:
  pgdata:
  files:
