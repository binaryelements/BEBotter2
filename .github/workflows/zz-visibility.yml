name: visibility probe

# Throwaway: checks whether the workflow token can make the base image package
# public, and at which endpoint. Delete once the answer is known.

on:
  push:
    paths:
      - .github/workflows/zz-visibility.yml

permissions:
  packages: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: user package
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PATCH /user/packages/container/bebotter2-base -f visibility=public
      - name: org package
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PATCH /orgs/binaryelements/packages/container/bebotter2-base -f visibility=public
      - name: list packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api /user/packages?package_type=container 2>&1 | head -20
